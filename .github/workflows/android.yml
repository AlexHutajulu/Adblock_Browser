name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify and repair Gradle Wrapper
        run: |
          chmod +x gradlew
          if ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Detected corrupted gradle-wrapper.jar; restoring clean wrapper JAR..."
            if [ -f gradle/wrapper/gradle-wrapper.jar.base64 ]; then
              base64 -d gradle/wrapper/gradle-wrapper.jar.base64 > gradle/wrapper/gradle-wrapper.jar
            else
              DIST_URL=$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d'=' -f2- | sed 's/\\:/:/g')
              curl -fsSL "$DIST_URL" -o /tmp/gradle-dist.zip
              unzip -q /tmp/gradle-dist.zip -d /tmp/gradle-dist
              GRADLE_BIN=$(find /tmp/gradle-dist -name "gradle" -type f -executable | head -n 1)
              "$GRADLE_BIN" wrapper
              rm -rf /tmp/gradle-dist.zip /tmp/gradle-dist
            fi
          fi
          jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/platform-tools" >> $GITHUB_PATH
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
